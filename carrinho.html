<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaLoja — Meu Carrinho</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- =====================  NAVBAR  ===================== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display font-extrabold text-2xl text-slate-900">
        Nova<span class="text-amber-600">Loja</span>
      </a>

      <div class="flex items-center gap-4 sm:gap-6">
        <a href="index.html" class="text-sm font-medium text-slate-700 hover:text-amber-600">← Continuar comprando</a>

        <a href="carrinho.html" class="relative flex items-center gap-2 bg-amber-600 text-white px-4 py-2 rounded-xl">
          <span>🛒</span>
          <span class="text-sm font-medium hidden sm:inline">Carrinho</span>
          <span class="contador-carrinho hidden absolute -top-2 -right-2 bg-slate-900 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- =====================  CONTEÚDO  ===================== -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-10">
    <h1 class="font-display text-2xl font-bold text-slate-800 mb-6">Meu Carrinho</h1>

    <!-- Mensagem exibida quando o carrinho está vazio -->
    <div id="carrinho-vazio" class="hidden text-center bg-white rounded-2xl shadow-sm p-12">
      <p class="text-5xl mb-4">🛒</p>
      <p class="text-slate-600 mb-6">Seu carrinho ainda está vazio.</p>
      <a href="index.html" class="inline-block bg-slate-900 hover:bg-amber-600 transition-colors text-white font-medium px-6 py-3 rounded-xl">
        Ver Catálogo
      </a>
    </div>

    <!-- Lista de itens: preenchida dinamicamente por renderizarCarrinho() em app.js -->
    <div id="lista-carrinho" class="space-y-4 mb-6"></div>

    <!-- Resumo / total do pedido -->
    <div id="resumo-carrinho" class="hidden bg-white rounded-2xl shadow-sm p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <p class="text-slate-500 text-sm">Total de itens: <span id="qtd-itens" class="font-semibold text-slate-700">0</span></p>
        <p class="text-2xl font-bold text-slate-900">Total: <span id="valor-total">R$ 0,00</span></p>
      </div>
      <a href="checkout.html"
         class="text-center bg-amber-600 hover:bg-amber-700 transition-colors text-white font-semibold px-8 py-3 rounded-xl">
        Finalizar Compra →
      </a>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    NovaLoja © 2026 — Projeto escolar de demonstração.
  </footer>

  <script src="js/produtos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
