<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanVibe — Checkout</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- =====================  NAVBAR  ===================== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display font-extrabold text-2xl text-slate-900">
        Nova<span class="text-amber-600">Loja</span>
      </a>
      <a href="carrinho.html" class="relative flex items-center gap-2 bg-slate-900 hover:bg-amber-600 transition-colors text-white px-4 py-2 rounded-xl">
        <span>🛒</span>
        <span class="text-sm font-medium hidden sm:inline">Carrinho</span>
        <span class="contador-carrinho hidden absolute -top-2 -right-2 bg-amber-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </a>
    </nav>
  </header>

  <!-- =====================  CONTEÚDO  ===================== -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-10">
    <h1 class="font-display text-2xl font-bold text-slate-800 mb-6">Finalizar Compra</h1>

    <div class="grid md:grid-cols-5 gap-6">

      <!-- ---------- FORMULÁRIO DE CHECKOUT ---------- -->
      <form id="form-checkout" onsubmit="finalizarCompra(event)" class="md:col-span-3 bg-white rounded-2xl shadow-sm p-6 space-y-4">

        <h2 class="font-display font-bold text-slate-800 mb-2">Dados do Pedido</h2>

        <div>
          <label for="nome" class="block text-sm font-medium text-slate-700 mb-1">Nome completo</label>
          <input type="text" id="nome" name="nome" required placeholder="Digite seu nome"
                 class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input type="email" id="email" name="email" required placeholder="voce@email.com"
                 class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div>
          <label for="endereco" class="block text-sm font-medium text-slate-700 mb-1">Endereço de entrega</label>
          <input type="text" id="endereco" name="endereco" required placeholder="Rua, número, bairro, cidade"
                 class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>

        <div>
          <label for="pagamento" class="block text-sm font-medium text-slate-700 mb-1">Forma de pagamento</label>
          <select id="pagamento" name="pagamento" required
                  class="w-full border border-slate-300 rounded-xl px-4 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="Cartão de Débito">Cartão de Débito</option>
            <option value="Pix">Pix</option>
            <option value="Boleto Bancário">Boleto Bancário</option>
          </select>
        </div>

        <button id="btn-finalizar" type="submit"
                class="w-full bg-amber-600 hover:bg-amber-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-white font-semibold py-3 rounded-xl mt-4">
          Confirmar Pedido
        </button>
      </form>

      <!-- ---------- RESUMO DO PEDIDO ---------- -->
      <aside class="md:col-span-2 bg-white rounded-2xl shadow-sm p-6 h-fit">
        <h2 class="font-display font-bold text-slate-800 mb-3">Resumo do Pedido</h2>
        <!-- Preenchido dinamicamente por renderizarResumoCheckout() em app.js -->
        <div id="resumo-checkout"></div>
      </aside>

    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    UrbanVibe © 2026 
  </footer>

  <script src="js/produtos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
